[package]
name = "vedi"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# Their harness rejects criterion's options; the benches are in benches/.
bench = false

[[bin]]
name = "vedi"
bench = false

[dependencies]
base64 = "0.23.1"
crossterm = { version = "0.29.0", features = ["use-dev-tty"] }
glob = "0.3.4"
libc = "0.2.190"
notify = "8.2.0"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "text"
harness = false

[[bench]]
name = "view"
harness = false

[lints]
workspace = true
