version: 2

builds:
  - builder: rust
    binary: vedi
    # bin/release-notes wants only the changelog.
    skip: '{{ isEnvSet "VEDI_SKIP_BUILD" }}'
    # Go's static binary ran on any linux; 2.17 is the oldest glibc zig
    # targets.
    targets:
      - x86_64-unknown-linux-gnu.2.17
      - aarch64-unknown-linux-gnu.2.17
      - x86_64-apple-darwin
      - aarch64-apple-darwin
    env: ['VEDI_VERSION={{ .Tag }}']
    # The workspace also holds the bench crate.
    flags: [--release, -p=vedi]

archives:
  - formats: [tar.gz]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - LICENSE
      - README.md
      - src: vedi/completions/*
        dst: completions

checksum:
  name_template: checksums.txt

# The changelog is feat, fix and perf; the rest changes nothing a user
# sees. Each type takes an optional scope and !, as bin/next-version does.
changelog:
  filters:
    exclude:
      - '^refactor(\([^)]*\))?!?:'
      - '^test(\([^)]*\))?!?:'
      - '^docs(\([^)]*\))?!?:'
      - '^build(\([^)]*\))?!?:'
      - '^ci(\([^)]*\))?!?:'
      - '^chore(\([^)]*\))?!?:'
  groups:
    - title: Features
      regexp: '^feat(\([^)]*\))?!?:'
      order: 0
    - title: Fixes
      regexp: '^fix(\([^)]*\))?!?:'
      order: 1
    - title: Performance
      regexp: '^perf(\([^)]*\))?!?:'
      order: 2
    - title: Other
      order: 999

# Sign and notarize darwin binaries; skipped when secrets are absent.
notarize:
  macos:
    - enabled: '{{ isEnvSet "APPLE_CERTIFICATE_P12_BASE64" }}'
      sign:
        certificate: '{{ .Env.APPLE_CERTIFICATE_P12_BASE64 }}'
        password: '{{ .Env.APPLE_CERTIFICATE_PASSWORD }}'
      notarize:
        issuer_id: '{{ .Env.APPLE_API_ISSUER_ID }}'
        key_id: '{{ .Env.APPLE_API_KEY_ID }}'
        key: '{{ .Env.APPLE_API_KEY_P8_BASE64 }}'
        wait: true

# Publish a cask to the tap; skipped when the token is absent.
homebrew_casks:
  - repository:
      owner: dlh
      name: homebrew-tap
      token: '{{ .Env.HOMEBREW_TAP_TOKEN }}'
    commit_author:
      name: Daniel Lee Harple
      email: git@dlh.dev
    homepage: https://github.com/dlh/vedi
    description: Pager for colored text; select with the keyboard and copy
    completions:
      bash: completions/vedi.bash
      zsh: completions/_vedi
      fish: completions/vedi.fish
    skip_upload: '{{ if not (isEnvSet "HOMEBREW_TAP_TOKEN") }}true{{ end }}'
