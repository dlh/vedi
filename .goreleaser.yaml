version: 2

builds:
  - main: ./cmd/vedi
    binary: vedi
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags: -s -w -X main.version={{.Tag}}

archives:
  - formats: [tar.gz]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - LICENSE
      - README.md
      - src: internal/cli/completions/*
        dst: completions

checksum:
  name_template: checksums.txt

# The changelog is feat, fix and perf; the rest changes nothing a user
# sees.
changelog:
  filters:
    exclude: ['^refactor:', '^test:', '^docs:', '^build:', '^ci:', '^chore:']
  groups:
    - title: Features
      regexp: '^feat:'
      order: 0
    - title: Fixes
      regexp: '^fix:'
      order: 1
    - title: Performance
      regexp: '^perf:'
      order: 2
    - title: Other
      order: 999

# Sign and notarize darwin binaries; skipped when secrets are absent.
notarize:
  macos:
    - enabled: '{{ isEnvSet "APPLE_CERTIFICATE_P12_BASE64" }}'
      sign:
        certificate: '{{ .Env.APPLE_CERTIFICATE_P12_BASE64 }}'
        password: '{{ .Env.APPLE_CERTIFICATE_PASSWORD }}'
      notarize:
        issuer_id: '{{ .Env.APPLE_API_ISSUER_ID }}'
        key_id: '{{ .Env.APPLE_API_KEY_ID }}'
        key: '{{ .Env.APPLE_API_KEY_P8_BASE64 }}'
        wait: true

# Publish a cask to the tap; skipped when the token is absent.
homebrew_casks:
  - repository:
      owner: dlh
      name: homebrew-tap
      token: '{{ .Env.HOMEBREW_TAP_TOKEN }}'
    commit_author:
      name: Daniel Lee Harple
      email: git@dlh.dev
    homepage: https://github.com/dlh/vedi
    description: Pager for colored text; select with the keyboard and copy
    completions:
      bash: completions/vedi.bash
      zsh: completions/_vedi
      fish: completions/vedi.fish
    skip_upload: '{{ if not (isEnvSet "HOMEBREW_TAP_TOKEN") }}true{{ end }}'
