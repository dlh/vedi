version: 2

before:
  hooks:
    - make licenses

builds:
  - builder: rust
    binary: vedi
    targets:
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu
      - aarch64-apple-darwin
    # The release workflow builds each target on its own runner and hands
    # the binaries over in VEDI_PREBUILT; without it, the tool is cargo.
    tool: bin/cargo-prebuilt
    command: build
    env: ['VEDI_VERSION={{ .Tag }}']
    # The workspace also holds the bench crate.
    flags: [--release, -p=vedi]

archives:
  - formats: [tar.gz]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - LICENSE
      - src: target/LICENSE-THIRD-PARTY
        dst: LICENSE-THIRD-PARTY
      - README.md
      - CHANGELOG.md
      - src: vedi/completions/*
        dst: completions
      - src: vedi/man/*
        dst: man
      - src: docs/*.md
        dst: docs

checksum:
  name_template: checksums.txt

# The AUR package builds from this archive.
source:
  enabled: true
  prefix_template: '{{ .ProjectName }}-{{ .Version }}/'

# Sign and notarize darwin binaries; skipped when secrets are absent.
notarize:
  macos:
    - enabled: '{{ isEnvSet "APPLE_CERTIFICATE_P12_BASE64" }}'
      sign:
        certificate: '{{ .Env.APPLE_CERTIFICATE_P12_BASE64 }}'
        password: '{{ .Env.APPLE_CERTIFICATE_PASSWORD }}'
      notarize:
        issuer_id: '{{ .Env.APPLE_API_ISSUER_ID }}'
        key_id: '{{ .Env.APPLE_API_KEY_ID }}'
        key: '{{ .Env.APPLE_API_KEY_P8_BASE64 }}'
        wait: true

# Publish a cask to the tap; skipped when the token is absent.
homebrew_casks:
  - repository:
      owner: dlh
      name: homebrew-tap
      token: '{{ .Env.HOMEBREW_TAP_TOKEN }}'
    commit_author:
      name: Daniel Lee Harple
      email: git@dlh.dev
    homepage: https://github.com/dlh/vedi
    description: Pager for colored text; select with the keyboard and copy
    completions:
      bash: completions/vedi.bash
      zsh: completions/_vedi
      fish: completions/vedi.fish
    manpages: [man/vedi.1]
    skip_upload: '{{ if not (isEnvSet "HOMEBREW_TAP_TOKEN") }}true{{ end }}'

# Publish a source package to the AUR; skipped without the key.
aur_sources:
  - name: vedi
    homepage: https://github.com/dlh/vedi
    description: Pager for colored text; select with the keyboard and copy
    license: GPL-3.0-only
    maintainers: ['Daniel Lee Harple <git@dlh.dev>']
    depends: [gcc-libs, glibc]
    makedepends: [cargo]
    git_url: ssh://aur@aur.archlinux.org/vedi.git
    private_key: '{{ .Env.AUR_KEY }}'
    commit_author:
      name: Daniel Lee Harple
      email: git@dlh.dev
    # Per the Arch Rust package guidelines.
    prepare: |-
      cd "${pkgname}-${pkgver}"
      export RUSTUP_TOOLCHAIN=stable
      cargo fetch --locked --target "$(rustc -vV | sed -n 's/host: //p')"
    build: |-
      cd "${pkgname}-${pkgver}"
      export RUSTUP_TOOLCHAIN=stable
      export VEDI_VERSION="v${pkgver}"
      cargo build --frozen --release -p vedi
    package: |-
      cd "${pkgname}-${pkgver}"
      install -Dm755 target/release/vedi "${pkgdir}/usr/bin/vedi"
      install -Dm644 vedi/man/vedi.1 "${pkgdir}/usr/share/man/man1/vedi.1"
      install -Dm644 vedi/completions/vedi.bash "${pkgdir}/usr/share/bash-completion/completions/vedi"
      install -Dm644 vedi/completions/_vedi "${pkgdir}/usr/share/zsh/site-functions/_vedi"
      install -Dm644 vedi/completions/vedi.fish "${pkgdir}/usr/share/fish/vendor_completions.d/vedi.fish"
      install -Dm644 -t "${pkgdir}/usr/share/doc/vedi" README.md CHANGELOG.md docs/*.md
    skip_upload: '{{ if not (isEnvSet "AUR_KEY") }}true{{ end }}'

# Publish a binary package from the linux archives; skipped without the key.
aurs:
  - name: vedi-bin
    homepage: https://github.com/dlh/vedi
    description: Pager for colored text; select with the keyboard and copy
    license: GPL-3.0-only
    maintainers: ['Daniel Lee Harple <git@dlh.dev>']
    depends: [gcc-libs, glibc]
    git_url: ssh://aur@aur.archlinux.org/vedi-bin.git
    private_key: '{{ .Env.AUR_KEY }}'
    commit_author:
      name: Daniel Lee Harple
      email: git@dlh.dev
    package: |-
      install -Dm755 vedi "${pkgdir}/usr/bin/vedi"
      install -Dm644 LICENSE-THIRD-PARTY "${pkgdir}/usr/share/licenses/${pkgname}/LICENSE-THIRD-PARTY"
      install -Dm644 man/vedi.1 "${pkgdir}/usr/share/man/man1/vedi.1"
      install -Dm644 completions/vedi.bash "${pkgdir}/usr/share/bash-completion/completions/vedi"
      install -Dm644 completions/_vedi "${pkgdir}/usr/share/zsh/site-functions/_vedi"
      install -Dm644 completions/vedi.fish "${pkgdir}/usr/share/fish/vendor_completions.d/vedi.fish"
      install -Dm644 -t "${pkgdir}/usr/share/doc/vedi" README.md CHANGELOG.md docs/*.md
    skip_upload: '{{ if not (isEnvSet "AUR_KEY") }}true{{ end }}'
