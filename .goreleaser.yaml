version: 2

builds:
  - main: ./cmd/vedi
    binary: vedi
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags: -s -w -X main.version={{.Tag}}

archives:
  - formats: [tar.gz]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'

checksum:
  name_template: checksums.txt

changelog:
  filters:
    exclude: ['^docs:', '^build:', '^ci:']
