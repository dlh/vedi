name: release

on:
  push:
    tags: ['v*']
  # A snapshot exercises the pipeline before a tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goreleaser:
    # notify links CoreServices on darwin, so those targets need the
    # macOS SDK.
    runs-on: macos-latest
    # The environment admits only v* tags; a snapshot needs none of its secrets.
    environment: ${{ github.ref_type == 'tag' && 'release' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: rustup toolchain install
      - name: install zig
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -O https://ziglang.org/download/0.15.2/zig-aarch64-macos-0.15.2.tar.xz
          echo "3cc2bab367e185cdfb27501c4b30b1b0653c28d9f73df8dc91488e66ece5fa6b  zig-aarch64-macos-0.15.2.tar.xz" | shasum -a 256 -c
          tar xf zig-aarch64-macos-0.15.2.tar.xz
          echo "$PWD/zig-aarch64-macos-0.15.2" >> "$GITHUB_PATH"
      - run: cargo install --locked cargo-zigbuild@0.23.4
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          args: >-
            ${{ github.event_name == 'workflow_dispatch'
            && 'release --snapshot --clean --skip=notarize,publish'
            || 'release --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
