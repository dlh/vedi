name: release

on:
  push:
    tags: ['v*']
  # A snapshot exercises the pipeline before a tag.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

  goreleaser:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write # for cosign
    # The environment admits only v* tags; a snapshot, even one run from a
    # tag, needs none of its secrets.
    environment: ${{ github.event_name == 'push' && 'release' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.23
          install_args: github:EmbarkStudios/cargo-about goreleaser cosign
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vedi-*
          path: ${{ runner.temp }}/prebuilt
      # The release notes are the tag's CHANGELOG.md entry.
      - if: github.event_name == 'push'
        run: bin/release-notes "$GITHUB_REF_NAME" >"$RUNNER_TEMP/notes.md"
      - run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
              goreleaser release --snapshot --clean --skip=notarize,publish
          else
              # goreleaser skips signing and publishing without their secrets.
              for name in APPLE_CERTIFICATE_P12_BASE64 APPLE_CERTIFICATE_PASSWORD \
                  APPLE_API_ISSUER_ID APPLE_API_KEY_ID APPLE_API_KEY_P8_BASE64 \
                  HOMEBREW_TAP_TOKEN AUR_KEY; do
                  if [ -z "${!name}" ]; then
                      echo "release: $name is not set" >&2
                      exit 1
                  fi
              done
              goreleaser release --clean --release-notes="$RUNNER_TEMP/notes.md"
          fi
        env:
          VEDI_PREBUILT: ${{ runner.temp }}/prebuilt
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
      # A snapshot tries the check attest makes on a release.
      - if: github.event_name == 'workflow_dispatch'
        run: bin/verify-checksums dist

  # Its own job, so a failure re-runs without releasing again. It runs after a
  # failed goreleaser too, which may have published the release before failing.
  attest:
    needs: goreleaser
    if: ${{ !cancelled() && github.event_name == 'push' && needs.goreleaser.result != 'skipped' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.23
          install_args: cosign
      # The published checksums, only if this workflow signed them at this commit.
      - run: |
          gh release download "$GITHUB_REF_NAME" --dir "$RUNNER_TEMP" \
              --pattern checksums.txt --pattern checksums.txt.sigstore.json
          bin/verify-checksums "$RUNNER_TEMP"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/checksums.txt
