name: release

on:
  push:
    tags: ['v*']
  # A snapshot exercises the pipeline before a tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

  goreleaser:
    needs: build
    runs-on: ubuntu-24.04
    # The environment admits only v* tags; a snapshot needs none of its secrets.
    environment: ${{ github.ref_type == 'tag' && 'release' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vedi-*
          path: ${{ runner.temp }}/prebuilt
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          args: >-
            ${{ github.event_name == 'workflow_dispatch'
            && 'release --snapshot --clean --skip=notarize,publish'
            || 'release --clean' }}
        env:
          VEDI_PREBUILT: ${{ runner.temp }}/prebuilt
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
